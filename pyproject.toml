[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "szlholdings"
version = "0.1.0"
description = "SZL Holdings estate SDK: live GitHub + Hugging Face inventory, alignment matrix, and governed-receipt tooling for the szl-holdings / SZLHOLDINGS estate."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SZL Holdings", email = "stephenlutar2@gmail.com" }]
keywords = ["governed-ai", "receipts", "huggingface", "github", "provenance", "estate"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-portal"
Source = "https://github.com/szl-holdings/szl-portal"
Documentation = "https://github.com/szl-holdings/szl-portal/tree/main/DEVELOPER.md"

[project.scripts]
szlholdings = "szlholdings.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/szlholdings"]

[tool.szl.release]
import_names = ["szlholdings"]
